name: Release SDK
permissions:
  contents: write
  # Required for npm trusted publishing via OIDC.
  id-token: write
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to release (default: latest)'
        required: false
        default: 'latest'
      isPatchVersion:
        description: 'Bump patch version instead of minor'
        required: false
        type: boolean
        default: false
      isMajorVersion:
        description: 'Bump major version instead of minor'
        required: false
        type: boolean
        default: false
      forcePublishNpm:
        description: 'Publish to NPM even when SDK tarball content matches the repo (version-only release)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Create a GitHub app token for the auto-update app
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GROUNDCOVER_BOT_APP_ID }}
          private-key: ${{ secrets.GROUNDCOVER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Capture repo version
        id: repo_version
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "Error: package.json not found in repo checkout."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Error: package.json must contain a numeric MAJOR.MINOR.PATCH version."
            exit 1
          fi
          echo "Published repo version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - name: Download and Extract SDK
        env:
          COMMIT_HASH: ${{ github.event.inputs.commit_hash }}
          IS_MAJOR_VERSION: ${{ github.event.inputs.isMajorVersion }}
          IS_PATCH_VERSION: ${{ github.event.inputs.isPatchVersion }}
        run: |
          set -euo pipefail
          if [ "$IS_MAJOR_VERSION" = "true" ] && [ "$IS_PATCH_VERSION" = "true" ]; then
            echo "Error: Cannot set both isMajorVersion and isPatchVersion to true. Please choose only one type of bump or neither (for minor bump)."
            exit 1
          fi

          # Clean up the SDK to only include the necessary files
          rm -rf src/
          rm -rf openapi-ts.config.ts
          rm -rf vitest.config.ts
          rm -rf tsconfig.json
          rm -rf package.json
          rm -rf biome.json

          # Download the SDK
          FILE_URL="https://groundcover-openapi-sdk-bucket.s3.us-east-1.amazonaws.com/groundcover-sdk-typescript-${COMMIT_HASH}.tar.gz"
          echo "Downloading from ${FILE_URL}"
          curl -L -o groundcover-sdk-typescript.tar.gz "${FILE_URL}"
          tar -xzf groundcover-sdk-typescript.tar.gz
          rm groundcover-sdk-typescript.tar.gz
          git checkout -- .gitignore

      - name: Install and Build SDK
        run: |
          set -euo pipefail
          pnpm install
          pnpm run build

      - name: Detect SDK content changes
        id: sdk_changes
        run: |
          set -euo pipefail
          # Stage SDK files but exclude package.json — the tarball ships a monorepo
          # placeholder version that would otherwise always look like a change.
          git add README.md pnpm-lock.yaml pnpm-workspace.yaml src tests biome.json openapi-ts.config.ts tsconfig.json vitest.config.ts .gitignore
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SDK content changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SDK content changes detected."
          fi
          git reset

      - name: Prepare and Bump Version File
        id: version_logic
        env:
          REPO_VERSION: ${{ steps.repo_version.outputs.version }}
          IS_MAJOR_VERSION: ${{ github.event.inputs.isMajorVersion }}
          IS_PATCH_VERSION: ${{ github.event.inputs.isPatchVersion }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "Error: package.json not found after download."
            exit 1
          fi

          # Bump from the repo's published version. The monorepo tarball ships
          # package.json at 0.0.0 as a placeholder — using it would re-bump to
          # the same version already on main and skip NPM publish.
          OLD_VERSION_FROM_FILE="$REPO_VERSION"
          echo "Bumping from repo version: $OLD_VERSION_FROM_FILE"

          IFS='.' read -r -a VERSION_PARTS <<< "$OLD_VERSION_FROM_FILE"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          if [ "$IS_MAJOR_VERSION" = "true" ]; then
            echo "Bumping major version..."
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$IS_PATCH_VERSION" = "true" ]; then
            echo "Bumping patch version..."
            PATCH=$((PATCH + 1))
          else
            echo "Bumping minor version..."
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$OLD_VERSION_FROM_FILE" >> "$GITHUB_OUTPUT"

          npm pkg set "version=$NEW_VERSION"

      - name: Commit & Push SDK and Version Changes
        id: commit_changes
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          COMMIT_HASH: ${{ github.event.inputs.commit_hash }}
          FORCE_PUBLISH: ${{ github.event.inputs.forcePublishNpm }}
          SDK_CHANGED: ${{ steps.sdk_changes.outputs.changed }}
          NEW_VERSION: ${{ steps.version_logic.outputs.new_version }}
          REPO_VERSION: ${{ steps.repo_version.outputs.version }}
        run: |
          set -euo pipefail
          git config --global user.name 'groundcover-bot[bot]'
          git config --global user.email 'groundcover-bot[bot]@users.noreply.github.com'

          if [ "$SDK_CHANGED" = "true" ]; then
            echo "SDK content changed — committing SDK and version bump."
            git add README.md package.json pnpm-lock.yaml pnpm-workspace.yaml src tests biome.json openapi-ts.config.ts tsconfig.json vitest.config.ts .gitignore
            COMMIT_MSG="Update SDK to version ${NEW_VERSION} (SDK source: ${COMMIT_HASH})"
            git commit -m "$COMMIT_MSG"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE_PUBLISH" = "true" ]; then
            if [ "$NEW_VERSION" = "$REPO_VERSION" ]; then
              echo "Error: forcePublishNpm requested but version is unchanged (${NEW_VERSION})."
              echo "Use isPatchVersion or isMajorVersion to pick a new version."
              exit 1
            fi
            echo "forcePublishNpm enabled — committing version-only release (${REPO_VERSION} -> ${NEW_VERSION})."
            git add package.json pnpm-lock.yaml
            COMMIT_MSG="Release version ${NEW_VERSION} (force NPM publish, SDK source: ${COMMIT_HASH})"
            git commit -m "$COMMIT_MSG"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SDK content changes. Skipping commit, tag, and release."
            echo "Tip: re-run with forcePublishNpm=true to publish a version-only release."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to NPM
        if: steps.commit_changes.outputs.committed == 'true'
        id: publish_npm
        run: |
          set -euo pipefail
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Create and Push Tag
        if: steps.publish_npm.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW_VERSION: ${{ steps.version_logic.outputs.new_version }}
        run: |
          set -euo pipefail
          NEW_VERSION_TAG="v${NEW_VERSION}"
          echo "Creating and pushing tag: $NEW_VERSION_TAG"
          git tag "$NEW_VERSION_TAG"
          git push origin "$NEW_VERSION_TAG"

      - name: Create GitHub Release
        if: steps.publish_npm.outputs.published == 'true'
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          tag_name: "v${{ steps.version_logic.outputs.new_version }}"
          release_name: "Release v${{ steps.version_logic.outputs.new_version }}"
          body: |
            Automated release for version ${{ steps.version_logic.outputs.new_version }}.
            SDK source commit: ${{ github.event.inputs.commit_hash }}
            Previous version: ${{ steps.version_logic.outputs.current_version }}
            Force NPM publish: ${{ github.event.inputs.forcePublishNpm }}
          draft: false
