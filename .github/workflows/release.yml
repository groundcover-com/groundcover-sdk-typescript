name: Release SDK
permissions:
  contents: read
concurrency:
  group: release-${{ github.workflow }}
  # Never cancel after an immutable npm version may have been published.
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to release (default: latest)'
        required: false
        default: 'latest'
      isPatchVersion:
        description: 'Bump patch version instead of minor'
        required: false
        type: boolean
        default: false
      isMajorVersion:
        description: 'Bump major version instead of minor'
        required: false
        type: boolean
        default: false
      forcePublishNpm:
        description: 'Publish to NPM even when SDK tarball content matches the repo (version-only release)'
        required: false
        type: boolean
        default: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      current_version: ${{ steps.version_logic.outputs.current_version }}
      new_version: ${{ steps.version_logic.outputs.new_version }}
      package_name: ${{ steps.version_logic.outputs.package_name }}
      release_kind: ${{ steps.release_plan.outputs.release_kind }}
      should_publish: ${{ steps.release_plan.outputs.should_publish }}
      source_sha: ${{ steps.source_revision.outputs.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Capture repo version
        id: repo_version
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "Error: package.json not found in repo checkout."
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Error: package.json must contain a numeric MAJOR.MINOR.PATCH version."
            exit 1
          fi
          echo "Published repo version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Capture source revision
        id: source_revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.0

      - name: Download and Extract SDK
        env:
          COMMIT_HASH: ${{ github.event.inputs.commit_hash }}
          IS_MAJOR_VERSION: ${{ github.event.inputs.isMajorVersion }}
          IS_PATCH_VERSION: ${{ github.event.inputs.isPatchVersion }}
        run: |
          set -euo pipefail
          if [ "$IS_MAJOR_VERSION" = "true" ] && [ "$IS_PATCH_VERSION" = "true" ]; then
            echo "Error: Cannot set both isMajorVersion and isPatchVersion to true. Please choose only one type of bump or neither (for minor bump)."
            exit 1
          fi

          # Clean up the SDK to only include the necessary files
          rm -rf src/
          rm -rf openapi-ts.config.ts
          rm -rf vitest.config.ts
          rm -rf tsconfig.json
          rm -rf package.json
          rm -rf biome.json

          # Download the SDK
          FILE_URL="https://groundcover-openapi-sdk-bucket.s3.us-east-1.amazonaws.com/groundcover-sdk-typescript-${COMMIT_HASH}.tar.gz"
          echo "Downloading from ${FILE_URL}"
          curl -L -o groundcover-sdk-typescript.tar.gz "${FILE_URL}"
          tar -xzf groundcover-sdk-typescript.tar.gz
          rm groundcover-sdk-typescript.tar.gz
          git checkout -- .gitignore

      - name: Install and Build SDK
        run: |
          set -euo pipefail
          pnpm install
          pnpm run build

      - name: Detect SDK content changes
        id: sdk_changes
        run: |
          set -euo pipefail
          # Stage SDK files but exclude package.json — the tarball ships a monorepo
          # placeholder version that would otherwise always look like a change.
          git add README.md pnpm-lock.yaml pnpm-workspace.yaml src tests biome.json openapi-ts.config.ts tsconfig.json vitest.config.ts .gitignore
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No SDK content changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "SDK content changes detected."
          fi
          git reset

      - name: Prepare and Bump Version File
        id: version_logic
        env:
          REPO_VERSION: ${{ steps.repo_version.outputs.version }}
          IS_MAJOR_VERSION: ${{ github.event.inputs.isMajorVersion }}
          IS_PATCH_VERSION: ${{ github.event.inputs.isPatchVersion }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "Error: package.json not found after download."
            exit 1
          fi

          # Bump from the repo's published version. The monorepo tarball ships
          # package.json at 0.0.0 as a placeholder — using it would re-bump to
          # the same version already on main and skip NPM publish.
          OLD_VERSION_FROM_FILE="$REPO_VERSION"
          echo "Bumping from repo version: $OLD_VERSION_FROM_FILE"

          IFS='.' read -r -a VERSION_PARTS <<< "$OLD_VERSION_FROM_FILE"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          if [ "$IS_MAJOR_VERSION" = "true" ]; then
            echo "Bumping major version..."
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$IS_PATCH_VERSION" = "true" ]; then
            echo "Bumping patch version..."
            PATCH=$((PATCH + 1))
          else
            echo "Bumping minor version..."
            MINOR=$((MINOR + 1))
            PATCH=0
          fi

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "current_version=$OLD_VERSION_FROM_FILE" >> "$GITHUB_OUTPUT"

          npm pkg set \
            "version=$NEW_VERSION" \
            "repository.type=git" \
            "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if [ -z "$PACKAGE_NAME" ]; then
            echo "Error: package.json must contain a package name."
            exit 1
          fi
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Plan release
        id: release_plan
        env:
          FORCE_PUBLISH: ${{ github.event.inputs.forcePublishNpm }}
          SDK_CHANGED: ${{ steps.sdk_changes.outputs.changed }}
          NEW_VERSION: ${{ steps.version_logic.outputs.new_version }}
          REPO_VERSION: ${{ steps.repo_version.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$SDK_CHANGED" = "true" ]; then
            echo "SDK content changed — preparing SDK and version release."
            echo "release_kind=sdk" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$FORCE_PUBLISH" = "true" ]; then
            if [ "$NEW_VERSION" = "$REPO_VERSION" ]; then
              echo "Error: forcePublishNpm requested but version is unchanged (${NEW_VERSION})."
              echo "Use isPatchVersion or isMajorVersion to pick a new version."
              exit 1
            fi
            echo "forcePublishNpm enabled — preparing version-only release (${REPO_VERSION} -> ${NEW_VERSION})."
            echo "release_kind=version-only" >> "$GITHUB_OUTPUT"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SDK content changes. Skipping npm publish, commit, tag, and release."
            echo "Tip: re-run with forcePublishNpm=true to publish a version-only release."
            echo "release_kind=none" >> "$GITHUB_OUTPUT"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack release artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts
          tar -czf release-artifacts/release-source.tar.gz \
            README.md \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            src \
            tests \
            biome.json \
            openapi-ts.config.ts \
            tsconfig.json \
            vitest.config.ts \
            .gitignore

      - name: Upload release artifacts
        if: steps.release_plan.outputs.should_publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error
          retention-days: 1

  reserve:
    needs: prepare
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_commit_sha: ${{ steps.reserve_release.outputs.release_commit_sha }}
      release_ref: ${{ steps.reserve_release.outputs.release_ref }}
    steps:
      # Preserve the exact release commit remotely before npm publication.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GROUNDCOVER_BOT_APP_ID }}
          private-key: ${{ secrets.GROUNDCOVER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout prepared source revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Restore prepared SDK and version
        run: |
          set -euo pipefail
          rm -rf \
            README.md \
            package.json \
            pnpm-lock.yaml \
            pnpm-workspace.yaml \
            src \
            tests \
            biome.json \
            openapi-ts.config.ts \
            tsconfig.json \
            vitest.config.ts \
            .gitignore
          tar -xzf release-artifacts/release-source.tar.gz

      - name: Commit and reserve release
        id: reserve_release
        env:
          COMMIT_HASH: ${{ github.event.inputs.commit_hash }}
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          RELEASE_KIND: ${{ needs.prepare.outputs.release_kind }}
          REPO_VERSION: ${{ needs.prepare.outputs.current_version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name 'groundcover-bot[bot]'
          git config user.email 'groundcover-bot[bot]@users.noreply.github.com'

          if [ "$RELEASE_KIND" = "sdk" ]; then
            git add README.md package.json pnpm-lock.yaml pnpm-workspace.yaml src tests biome.json openapi-ts.config.ts tsconfig.json vitest.config.ts .gitignore
            COMMIT_MSG="Update SDK to version ${NEW_VERSION} (SDK source: ${COMMIT_HASH})"
          elif [ "$RELEASE_KIND" = "version-only" ]; then
            git add package.json pnpm-lock.yaml
            COMMIT_MSG="Release version ${NEW_VERSION} (force NPM publish, SDK source: ${COMMIT_HASH})"
          else
            echo "Error: unsupported release kind: ${RELEASE_KIND}"
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "Error: there are no prepared changes to reserve."
            exit 1
          fi

          SOURCE_DATE="$(git show -s --format=%aI "$SOURCE_SHA")"
          GIT_AUTHOR_DATE="$SOURCE_DATE" GIT_COMMITTER_DATE="$SOURCE_DATE" git commit -m "$COMMIT_MSG"
          RELEASE_REF="refs/heads/release-preparations/v${NEW_VERSION}-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:${RELEASE_REF}"
          echo "release_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "release_ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"

  publish:
    needs: [prepare, reserve]
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Restrict npm trusted-publishing credentials to this artifact-only job.
      id-token: write
    outputs:
      released: ${{ steps.publish_npm.outputs.released }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Verify source revision is current
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [ -z "$REMOTE_SHA" ] || [ "$REMOTE_SHA" != "$SOURCE_SHA" ]; then
            echo "Error: ${GITHUB_REF_NAME} moved after release preparation (${SOURCE_SHA} -> ${REMOTE_SHA:-unknown})."
            echo "Re-run the workflow against the latest revision."
            exit 1
          fi

      - name: Publish to NPM
        id: publish_npm
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          PACKAGE_NAME: ${{ needs.prepare.outputs.package_name }}
          # workflow_dispatch points at the pre-release source commit. Disable
          # automatic provenance rather than attest to the wrong source tree.
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          set -euo pipefail
          PACKAGES=(release-artifacts/*.tgz)
          if [ "${#PACKAGES[@]}" -ne 1 ]; then
            echo "Error: expected exactly one npm package tarball."
            exit 1
          fi

          LOCAL_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "${PACKAGES[0]}" | openssl base64 -A)"
          PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${NEW_VERSION}" version 2>/dev/null || true)"
          if [ "$PUBLISHED_VERSION" = "$NEW_VERSION" ]; then
            PUBLISHED_INTEGRITY="$(npm view "${PACKAGE_NAME}@${NEW_VERSION}" dist.integrity)"
            if [ "$PUBLISHED_INTEGRITY" != "$LOCAL_INTEGRITY" ]; then
              echo "Error: ${PACKAGE_NAME}@${NEW_VERSION} exists on npm with different package content."
              exit 1
            fi
            echo "${PACKAGE_NAME}@${NEW_VERSION} with matching integrity is already available from npm; continuing finalization."
          else
            npm publish "${PACKAGES[0]}" --access public --ignore-scripts
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"

  finalize:
    needs: [prepare, reserve, publish]
    if: needs.publish.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Create a GitHub app token for the auto-update app.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.GROUNDCOVER_BOT_APP_ID }}
          private-key: ${{ secrets.GROUNDCOVER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.reserve.outputs.release_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Finalize release commit on source branch
        env:
          RELEASE_COMMIT_SHA: ${{ needs.reserve.outputs.release_commit_sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          git config user.name 'groundcover-bot[bot]'
          git config user.email 'groundcover-bot[bot]@users.noreply.github.com'

          git fetch origin "$GITHUB_REF"
          CURRENT_SHA="$(git rev-parse FETCH_HEAD)"
          if [ "$CURRENT_SHA" != "$SOURCE_SHA" ]; then
            echo "Error: ${GITHUB_REF_NAME} moved during publication (${SOURCE_SHA} -> ${CURRENT_SHA})."
            echo "The published commit remains available at the release preparation ref."
            echo "Re-run the workflow against the latest revision to finalize the same npm artifact."
            exit 1
          fi
          git push origin "${RELEASE_COMMIT_SHA}:${GITHUB_REF}"

      - name: Create and Push Tag
        env:
          NEW_VERSION: ${{ needs.prepare.outputs.new_version }}
          RELEASE_COMMIT_SHA: ${{ needs.reserve.outputs.release_commit_sha }}
        run: |
          set -euo pipefail
          NEW_VERSION_TAG="v${NEW_VERSION}"
          echo "Creating and pushing tag: $NEW_VERSION_TAG"
          git tag "$NEW_VERSION_TAG" "$RELEASE_COMMIT_SHA"
          git push origin "$NEW_VERSION_TAG"

      - name: Create GitHub Release
        uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          tag_name: "v${{ needs.prepare.outputs.new_version }}"
          release_name: "Release v${{ needs.prepare.outputs.new_version }}"
          body: |
            Automated release for version ${{ needs.prepare.outputs.new_version }}.
            SDK source commit: ${{ github.event.inputs.commit_hash }}
            Previous version: ${{ needs.prepare.outputs.current_version }}
            Force NPM publish: ${{ github.event.inputs.forcePublishNpm }}
          draft: false

      - name: Delete release preparation branch
        continue-on-error: true
        env:
          RELEASE_REF: ${{ needs.reserve.outputs.release_ref }}
        run: git push origin --delete "${RELEASE_REF#refs/heads/}"
