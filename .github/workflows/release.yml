name: Release SDK
permissions:
  contents: write
  packages: write
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to release (default: latest)'
        required: false
        default: 'latest'
      isPatchVersion:
        description: 'Bump patch version instead of minor'
        required: false
        type: boolean
        default: false
      isMajorVersion:
        description: 'Bump major version instead of minor'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Create a GitHub app token for the auto-update app
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.GROUNDCOVER_BOT_APP_ID }}
          private-key: ${{ secrets.GROUNDCOVER_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.33.0

      - name: Download and Extract SDK
        env:
          COMMIT_HASH: ${{ github.event.inputs.commit_hash }}
        run: |
          # Guardrail for input combinations
          if [ "${{ github.event.inputs.isMajorVersion }}" = "true" ] && [ "${{ github.event.inputs.isPatchVersion }}" = "true" ]; then
            echo "Error: Cannot set both isMajorVersion and isPatchVersion to true. Please choose only one type of bump or neither (for minor bump)."
            exit 1
          fi

          # Clean up the SDK to only include the necessary files
          rm -rf src/
          rm -rf openapi-ts.config.ts
          rm -rf vitest.config.ts
          rm -rf tsconfig.json
          rm -rf package.json
          rm -rf biome.json

          # Download the SDK
          FILE_URL="https://groundcover-openapi-sdk-bucket.s3.us-east-1.amazonaws.com/groundcover-sdk-typescript-${COMMIT_HASH}.tar.gz"
          echo "Downloading from ${FILE_URL}"
          curl -L -o groundcover-sdk-typescript.tar.gz "${FILE_URL}"
          tar -xzf groundcover-sdk-typescript.tar.gz
          rm groundcover-sdk-typescript.tar.gz
          git checkout -- .gitignore

      - name: Install and Build SDK
        run: |
          pnpm install
          pnpm run build

      - name: Prepare and Bump Version File
        id: version_logic
        run: |
          if [ ! -f package.json ]; then
            echo "Error: package.json not found after download."
            exit 1
          fi

          # Extract current version from package.json using node
          OLD_VERSION_FROM_FILE=$(node -p "require('./package.json').version")
          PREVIOUS_VERSION_INFO="$OLD_VERSION_FROM_FILE"
          echo "Current version from package.json: $OLD_VERSION_FROM_FILE"

          IFS='.' read -r -a VERSION_PARTS <<< "$OLD_VERSION_FROM_FILE"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          if [ "${{ github.event.inputs.isMajorVersion }}" = "true" ]; then
            echo "Bumping major version..."
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "${{ github.event.inputs.isPatchVersion }}" = "true" ]; then
            echo "Bumping patch version..."
            PATCH=$((PATCH + 1))
          else
            echo "Bumping minor version..."
            MINOR=$((MINOR + 1))
            PATCH=0
          fi
          
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$PREVIOUS_VERSION_INFO" >> $GITHUB_OUTPUT

          # Update version in package.json
          npm pkg set version="$NEW_VERSION"

      - name: Commit & Push SDK and Version Changes
        id: commit_changes
        run: |
          git add README.md package.json pnpm-lock.yaml pnpm-workspace.yaml src tests biome.json openapi-ts.config.ts tsconfig.json vitest.config.ts .gitignore
          
          if git diff --staged --quiet; then
            echo "No changes to SDK files. Skipping commit, tag, and release."
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected. Committing and pushing..."
            COMMIT_MSG="Update SDK to version ${{ steps.version_logic.outputs.new_version }} (SDK source: ${{ github.event.inputs.commit_hash }})"
            git config --global user.name 'groundcover-bot[bot]'
            git config --global user.email 'groundcover-bot[bot]@users.noreply.github.com'
            git commit -m "$COMMIT_MSG"
            git push
            echo "committed=true" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create and Push Tag
        if: steps.commit_changes.outputs.committed == 'true'
        run: |
          NEW_VERSION_TAG="v${{ steps.version_logic.outputs.new_version }}"
          echo "Creating and pushing tag: $NEW_VERSION_TAG"
          git tag "$NEW_VERSION_TAG"
          git push origin "$NEW_VERSION_TAG"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Publish to NPM
        if: steps.commit_changes.outputs.committed == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.commit_changes.outputs.committed == 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        with:
          tag_name: "v${{ steps.version_logic.outputs.new_version }}"
          release_name: "Release v${{ steps.version_logic.outputs.new_version }}"
          body: |
            Automated release for version ${{ steps.version_logic.outputs.new_version }}.
            SDK source commit: ${{ github.event.inputs.commit_hash }}
            Previous version: ${{ steps.version_logic.outputs.current_version }}
          draft: false